<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BinAlert - ระบบแจ้งเตือนขยะโรงเรียน</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { sans: ['Prompt', 'sans-serif'] } } }
        }
    </script>
    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #0f172a; margin: 0; overflow: hidden; }
        
        .phone-frame {
            width: 100%;
            height: 100vh;
            height: 100dvh; 
            background: #ffffff;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: none;
            border-radius: 0;
        }
        
        @media (min-width: 480px) {
            .phone-frame {
                max-width: 390px;
                height: 90vh;
                max-height: 844px;
                border-radius: 40px;
                border: 8px solid #334155;
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
                margin: auto;
            }
        }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
        .no-select { user-select: none; -webkit-user-select: none; }

        /* Animation for beautiful radar pulse on map */
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.8; }
            100% { transform: scale(2.5); opacity: 0; }
        }
        .animate-pulse-ring {
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
    </style>
</head>
<body class="h-screen flex items-center justify-center sm:p-4">

    <div class="phone-frame">
        
        <header id="app-header" class="bg-slate-900 text-white px-5 py-4 flex justify-between items-center shadow-md z-20 shrink-0 hidden">
            <div class="flex items-center space-x-3">
                <button id="back-btn" onclick="goBack()" class="w-9 h-9 rounded-full bg-slate-800 hover:bg-slate-700 flex items-center justify-center text-white transition hidden">
                    <i class="fa-solid fa-arrow-left text-sm"></i>
                </button>
                <div>
                    <h1 id="header-title" class="font-bold text-base leading-tight">BinAlert</h1>
                    <p id="header-subtitle" class="text-[11px] text-slate-400">โรงเรียนจักรคำคณาทร จ.ลำพูน</p>
                </div>
            </div>
            <button id="switch-role-btn" onclick="switchRolePrompt()" class="bg-slate-800 hover:bg-slate-700 text-emerald-400 text-xs px-3 py-1.5 rounded-full font-medium border border-slate-700 flex items-center space-x-1.5 transition hidden">
                <i class="fa-solid fa-right-left text-[10px]"></i>
                <span id="role-badge-text">เปลี่ยนบทบาท</span>
            </button>
        </header>

        <div id="main-content" class="flex-1 overflow-y-auto bg-slate-50 relative flex flex-col">
            <!-- Loading Screen initially -->
            <div class="flex-1 flex flex-col items-center justify-center p-6 text-slate-500">
                <div class="relative w-16 h-16 mb-6">
                    <div class="absolute inset-0 border-4 border-slate-200 rounded-full"></div>
                    <div class="absolute inset-0 border-4 border-emerald-500 rounded-full border-t-transparent animate-spin"></div>
                </div>
                <h3 class="font-bold text-slate-700 text-lg mb-1">กำลังเตรียมระบบ...</h3>
            </div>
        </div>

        <nav id="bottom-nav" class="bg-white border-t border-slate-200 px-6 py-2 flex justify-around items-end z-20 shrink-0 shadow-[0_-5px_15px_rgba(0,0,0,0.03)] hidden pb-5 sm:pb-3">
            <!-- Nav content injected via JS -->
        </nav>

        <!-- Hidden Camera Input for cross-browser compat -->
        <input type="file" id="camera-input" accept="image/*" capture="environment" class="hidden" onchange="processPhoto(event)">

        <div id="bin-modal" class="absolute inset-x-0 bottom-0 bg-white rounded-t-[2rem] shadow-[0_-15px_40px_rgba(0,0,0,0.15)] border-t border-slate-200 p-6 z-50 transform translate-y-full transition-transform duration-300 flex flex-col">
            <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-6 shrink-0"></div>
            
            <div class="flex justify-between items-start mb-6 shrink-0">
                <div>
                    <span id="modal-status-badge" class="text-xs px-3 py-1 rounded-full font-semibold">ปกติ</span>
                    <h3 id="modal-title" class="font-bold text-xl text-slate-900 mt-2">ชื่อจุดถังขยะ</h3>
                    <p id="modal-location" class="text-sm text-slate-500 mt-1"><i class="fa-solid fa-location-dot text-emerald-500 mr-1.5"></i> ตำแหน่ง</p>
                </div>
                <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-500 flex items-center justify-center transition shrink-0">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            
            <div class="w-full shrink-0 pb-2">
                <button id="modal-action-btn" onclick="handleModalAction()" class="w-full py-4 rounded-2xl font-bold text-white text-base shadow-lg transition flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-camera text-lg"></i>
                    <span id="modal-action-text">ถ่ายรูประบุขยะเต็ม</span>
                </button>
            </div>
        </div>

        <div id="toast" class="absolute top-20 inset-x-4 bg-slate-900/95 backdrop-blur-md text-white px-4 py-3.5 rounded-2xl shadow-2xl z-50 transform -translate-y-32 opacity-0 transition-all duration-400 flex items-center space-x-3 border border-slate-700 pointer-events-none">
            <div id="toast-icon-bg" class="w-10 h-10 rounded-xl bg-emerald-500 text-white flex items-center justify-center shrink-0 shadow-inner">
                <i id="toast-icon" class="fa-solid fa-check text-base"></i>
            </div>
            <div>
                <h4 id="toast-title" class="font-bold text-sm leading-tight">สำเร็จ</h4>
                <p id="toast-message" class="text-[11px] text-slate-300 mt-0.5">บันทึกข้อมูลเรียบร้อยแล้ว</p>
            </div>
        </div>
        
        <div id="image-viewer" class="absolute inset-0 bg-black/90 z-50 hidden flex-col transition-opacity opacity-0">
            <div class="p-4 flex justify-between items-center text-white shrink-0">
                <h3 class="font-bold text-sm" id="viewer-title">รูปภาพแจ้งเตือน</h3>
                <button onclick="closeImageViewer()" class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center backdrop-blur-sm">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <div class="flex-1 flex items-center justify-center p-4 overflow-hidden">
                <img id="viewer-img" src="" class="max-w-full max-h-full object-contain rounded-lg">
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection, addDoc, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Configuration (Real-time Cloud)
        const firebaseConfig = {
            apiKey: "AIzaSyA9PTYshb0p-epm6CaWQkdwIhV0gePdNlE",
            authDomain: "binalert-app-ee134.firebaseapp.com",
            projectId: "binalert-app-ee134",
            storageBucket: "binalert-app-ee134.firebasestorage.app",
            messagingSenderId: "868487761387",
            appId: "1:868487761387:web:d79ec3de3ee18d50979dae",
            measurementId: "G-GZQMLGX100"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        // App State
        const defaultBinsData = [
            { id: "bin_1", name: "จุดถังขยะ อาคารโดม", location: "บริเวณโดม 115 ปี (จุดที่ 12)", status: "normal", time: null, x: 53, y: 38 },
            { id: "bin_2", name: "จุดถังขยะ สนามฟุตบอล", location: "ข้างสนามฟุตบอล / ลู่วิ่ง", status: "normal", time: null, x: 25, y: 72 },
            { id: "bin_3", name: "จุดถังขยะ หน้าอาคาร 4", location: "อาคารพิศาลโสภาคคุณ (อาคาร 4)", status: "normal", time: null, x: 58, y: 78 }
        ];

        let binsData = JSON.parse(JSON.stringify(defaultBinsData));
        let globalHistory = [];
        let currentRole = null; 
        let currentScreen = 'role-select'; 
        let selectedBinId = null;
        let isUploading = false;
        let isFirebaseConnected = false;

        async function initApp() {
            try {
                // Listen to statuses
                const statusDocRef = doc(db, 'binalert_data', 'statuses');
                onSnapshot(statusDocRef, (docSnap) => {
                    isFirebaseConnected = true;
                    if (docSnap.exists()) {
                        const statuses = docSnap.data();
                        
                        // Check if it's a new day to reset data visually
                        const todayStr = new Date().toDateString();
                        const lastDate = statuses.lastUpdatedDate;

                        binsData.forEach(bin => {
                            if (lastDate === todayStr && statuses[bin.id]) {
                                bin.status = statuses[bin.id].status;
                                bin.time = statuses[bin.id].time;
                            } else {
                                bin.status = 'normal'; // Reset if new day or no data
                            }
                        });
                    }
                    if (currentScreen === 'role-select') {
                        renderApp();
                    } else {
                        refreshCurrentScreen();
                    }
                }, (error) => {
                    console.error("Firebase Error:", error);
                    isFirebaseConnected = true;
                    renderApp();
                });

                // Listen to History
                const historyColRef = collection(db, 'binalert_history');
                const q = query(historyColRef, orderBy("timestampMs", "desc"), limit(50));
                onSnapshot(q, (snapshot) => {
                    globalHistory = [];
                    snapshot.forEach((doc) => {
                        globalHistory.push(doc.data());
                    });
                    if (currentScreen === 'history-view') refreshCurrentScreen();
                }, (error) => {
                     console.error("Firebase History Error:", error);
                });

            } catch (e) {
                console.error("Init Error:", e);
                isFirebaseConnected = true;
                renderApp();
            }
        }

        initApp();

        function setRole(role) {
            currentRole = role;
            currentScreen = (role === 'housekeeper') ? 'housekeeper-home' : 'student-home';
            renderApp();
        }

        function switchRolePrompt() {
            currentRole = null;
            currentScreen = 'role-select';
            renderApp();
        }

        function navigateTo(screen) {
            currentScreen = screen;
            closeModal();
            renderApp();
        }

        function goBack() {
            closeModal();
            navigateTo(currentRole === 'housekeeper' ? 'housekeeper-home' : 'student-home');
        }

        function refreshCurrentScreen() {
            if (currentScreen === 'map-view') {
                const mapContent = document.getElementById('map-pins-container');
                if(mapContent) {
                    document.getElementById('main-content').innerHTML = renderMapView();
                }
            } else if (currentScreen === 'history-view') {
                document.getElementById('main-content').innerHTML = renderHistoryView();
            } else if (currentScreen === 'housekeeper-home') {
                 document.getElementById('main-content').innerHTML = renderHousekeeperDashboard();
                 renderDashboardMapPins();
            } else if (currentScreen === 'student-home') {
                 document.getElementById('main-content').innerHTML = renderStudentDashboard();
            }
            
            // FIX TypeError: Safely check if modal and modal-title exist before updating
            const modalTitle = document.getElementById('modal-title');
            const binModal = document.getElementById('bin-modal');
            if(selectedBinId && binModal && !binModal.classList.contains('translate-y-full') && modalTitle) {
                updateModalContent(selectedBinId);
            }
        }

        function renderApp() {
            if (!isFirebaseConnected) return; 

            const content = document.getElementById('main-content');
            const bottomNav = document.getElementById('bottom-nav');
            const appHeader = document.getElementById('app-header');
            const backBtn = document.getElementById('back-btn');
            const switchRoleBtn = document.getElementById('switch-role-btn');

            if (currentScreen === 'role-select') {
                appHeader.classList.add('hidden');
                bottomNav.classList.add('hidden');
                content.innerHTML = renderRoleSelectScreen();
                return;
            } else {
                appHeader.classList.remove('hidden');
            }

            if (currentScreen === 'housekeeper-home' || currentScreen === 'student-home') {
                backBtn.classList.add('hidden');
                switchRoleBtn.classList.remove('hidden');
            } else {
                backBtn.classList.remove('hidden');
                switchRoleBtn.classList.add('hidden');
            }

            bottomNav.innerHTML = renderBottomNav();
            bottomNav.classList.remove('hidden');

            if (currentScreen === 'housekeeper-home') {
                content.innerHTML = renderHousekeeperDashboard();
                renderDashboardMapPins(); 
            } else if (currentScreen === 'student-home') {
                content.innerHTML = renderStudentDashboard();
            } else if (currentScreen === 'map-view') {
                content.innerHTML = renderMapView();
            } else if (currentScreen === 'history-view') {
                content.innerHTML = renderHistoryView();
            }
        }

        function renderRoleSelectScreen() {
            // Updated UI: Removed real-time text, enlarged logo, removed "เข้าใช้งานเป็น"
            return `
                <div class="flex-1 bg-slate-900 flex flex-col items-center justify-center p-6 text-white text-center relative h-full">
                    <div class="w-full max-w-sm flex flex-col items-center justify-center">
                        <div class="mb-10 text-center">
                            <div class="w-32 h-32 bg-gradient-to-br from-emerald-400 to-teal-500 rounded-[2.5rem] flex items-center justify-center text-7xl shadow-[0_0_40px_rgba(16,185,129,0.5)] mx-auto mb-6 relative">
                                <i class="fa-solid fa-leaf text-white relative z-10"></i>
                            </div>
                            <h1 class="text-4xl font-bold tracking-tight mb-3">BinAlert</h1>
                            <div class="inline-flex items-center space-x-2 bg-emerald-500/20 text-emerald-400 px-4 py-2 rounded-full border border-emerald-500/30 mt-1">
                                <span class="text-[12px] font-medium">โรงเรียนจักรคำคณาทร จังหวัดลำพูน</span>
                            </div>
                        </div>
                        <div class="space-y-4 w-full px-2">
                            <button onclick="setRole('student')" class="w-full bg-slate-800 hover:bg-slate-700 border border-slate-700 p-4 rounded-2xl flex items-center space-x-4 transition-all active:scale-95 group shadow-lg">
                                <div class="w-14 h-14 rounded-xl bg-blue-500/20 text-blue-400 flex items-center justify-center text-2xl shrink-0 group-hover:bg-blue-500 group-hover:text-white transition-colors">
                                    <i class="fa-solid fa-user-graduate"></i>
                                </div>
                                <div class="text-left flex-1">
                                    <h3 class="font-bold text-lg">นักเรียน</h3>
                                    <p class="text-xs text-slate-400 mt-0.5">แจ้งเตือนถังขยะเต็ม</p>
                                </div>
                                <i class="fa-solid fa-chevron-right text-slate-600 text-sm"></i>
                            </button>
                            <button onclick="setRole('housekeeper')" class="w-full bg-slate-800 hover:bg-slate-700 border border-slate-700 p-4 rounded-2xl flex items-center space-x-4 transition-all active:scale-95 group shadow-lg">
                                <div class="w-14 h-14 rounded-xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-2xl shrink-0 group-hover:bg-emerald-500 group-hover:text-white transition-colors">
                                    <i class="fa-solid fa-broom"></i>
                                </div>
                                <div class="text-left flex-1">
                                    <h3 class="font-bold text-lg">แม่บ้าน</h3>
                                    <p class="text-xs text-slate-400 mt-0.5">รับแจ้งและเคลียร์จุดขยะ</p>
                                </div>
                                <i class="fa-solid fa-chevron-right text-slate-600 text-sm"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderBottomNav() {
            // Flat Menu alignment without circles
            const isHome = currentScreen === 'housekeeper-home' || currentScreen === 'student-home';
            const themeColor = currentRole === 'student' ? 'blue' : 'emerald';
            const activeColorClass = `text-${themeColor}-600`;

            return `
                <div class="flex justify-between items-center w-full max-w-[300px] mx-auto">
                    <!-- Home -->
                    <button onclick="navigateTo('${currentRole}-home')" class="flex flex-col items-center justify-center w-16 h-12 ${isHome ? activeColorClass : 'text-slate-400 hover:text-slate-600'} transition-colors">
                        <i class="fa-solid fa-house text-xl mb-1"></i>
                        <span class="text-[10px] font-medium">หน้าแรก</span>
                    </button>
                    
                    <!-- Map (Flat, No Circles) -->
                    <button onclick="navigateTo('map-view')" class="flex flex-col items-center justify-center w-16 h-12 ${currentScreen === 'map-view' ? activeColorClass : 'text-slate-400 hover:text-slate-600'} transition-colors">
                        <i class="fa-solid fa-map-location-dot text-xl mb-1"></i>
                        <span class="text-[10px] font-medium">แผนผัง</span>
                    </button>

                    <!-- History -->
                    <button onclick="navigateTo('history-view')" class="flex flex-col items-center justify-center w-16 h-12 ${currentScreen === 'history-view' ? activeColorClass : 'text-slate-400 hover:text-slate-600'} transition-colors">
                        <i class="fa-solid fa-clock-rotate-left text-xl mb-1"></i>
                        <span class="text-[10px] font-medium">ประวัติ</span>
                    </button>
                </div>
            `;
        }

        function renderHousekeeperDashboard() {
            const urgentCount = binsData.filter(b => b.status === 'full').length;
            const normalCount = binsData.filter(b => b.status === 'normal').length;
            return `
                <div class="p-5 space-y-5 pb-24">
                    <div class="bg-gradient-to-r from-emerald-600 to-teal-700 text-white p-5 rounded-3xl shadow-lg relative overflow-hidden">
                        <div class="absolute -right-4 -top-4 w-24 h-24 bg-white opacity-10 rounded-full blur-xl"></div>
                        <div class="relative z-10 flex items-center space-x-4">
                            <div class="w-12 h-12 bg-white/20 backdrop-blur-sm rounded-2xl flex items-center justify-center shrink-0 shadow-inner">
                                <i class="fa-solid fa-broom text-2xl"></i>
                            </div>
                            <div>
                                <h2 class="font-bold text-lg">โหมดแม่บ้าน</h2>
                                <p class="text-[11px] text-emerald-100 mt-0.5 leading-tight opacity-90">ระบบรับแจ้งเตือนแบบเรียลไทม์</p>
                            </div>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div class="bg-white p-4 rounded-3xl border border-slate-100 shadow-sm flex flex-col items-center justify-center text-center">
                            <span class="text-3xl font-black text-emerald-600 mb-1">${normalCount}</span>
                            <span class="text-xs font-semibold text-slate-500">จุดปกติ (ว่าง)</span>
                        </div>
                        <div class="bg-white p-4 rounded-3xl border ${urgentCount > 0 ? 'border-rose-200 bg-rose-50/50 shadow-rose-100' : 'border-slate-100'} shadow-sm flex flex-col items-center justify-center text-center relative overflow-hidden">
                            ${urgentCount > 0 ? `<div class="absolute top-2 right-2 w-2 h-2 bg-rose-500 rounded-full animate-ping"></div>` : ''}
                            <span class="text-3xl font-black ${urgentCount > 0 ? 'text-rose-600' : 'text-slate-600'} mb-1 relative z-10">${urgentCount}</span>
                            <span class="text-xs font-semibold ${urgentCount > 0 ? 'text-rose-600' : 'text-slate-500'} relative z-10">ต้องเก็บด่วน</span>
                        </div>
                    </div>
                    <div class="bg-white p-4 rounded-3xl shadow-sm border border-slate-100">
                        <div class="flex justify-between items-center mb-3 px-1">
                            <h2 class="font-bold text-sm text-slate-800">แผนผังจุดทิ้งขยะ</h2>
                            <button onclick="navigateTo('map-view')" class="text-[11px] font-bold text-emerald-600 hover:text-emerald-700 bg-emerald-50 px-2 py-1 rounded-lg">
                                ดูแผนที่ <i class="fa-solid fa-chevron-right ml-0.5 text-[9px]"></i>
                            </button>
                        </div>
                        <div onclick="navigateTo('map-view')" class="relative w-full h-40 rounded-2xl overflow-hidden border border-slate-200 cursor-pointer bg-slate-100">
                            <img src="https://placehold.co/600x350/f8fafc/94a3b8?text=School+Map" class="w-full h-full object-cover opacity-60">
                            <div id="dashboard-map-pins" class="absolute inset-0"></div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderStudentDashboard() {
            return `
                <div class="p-5 space-y-5 pb-24">
                    <div class="bg-gradient-to-r from-blue-600 to-indigo-700 text-white p-5 rounded-3xl shadow-lg relative overflow-hidden">
                        <div class="absolute -right-4 -bottom-4 w-24 h-24 bg-white opacity-10 rounded-full blur-xl"></div>
                        <div class="relative z-10 flex items-center space-x-4">
                            <div class="w-12 h-12 bg-white/20 backdrop-blur-sm rounded-2xl flex items-center justify-center shrink-0 shadow-inner">
                                <i class="fa-solid fa-user-graduate text-2xl"></i>
                            </div>
                            <div>
                                <h2 class="font-bold text-lg">โหมดนักเรียน</h2>
                                <p class="text-[11px] text-blue-100 mt-0.5 leading-tight opacity-90">ช่วยแจ้งเตือนแม่บ้านเมื่อขยะล้น</p>
                            </div>
                        </div>
                    </div>
                    
                    <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 text-center">
                         <div class="w-16 h-16 bg-blue-50 text-blue-500 rounded-full flex items-center justify-center text-3xl mx-auto mb-3">
                            <i class="fa-solid fa-camera-retro"></i>
                         </div>
                         <h3 class="font-bold text-slate-800 text-base mb-2">พบถังขยะเต็ม?</h3>
                         <p class="text-xs text-slate-500 mb-4 px-4 leading-relaxed">กดที่แผนผังด้านล่าง เลือกจุดที่พบ และถ่ายรูปเพื่อแจ้งเตือนให้แม่บ้านมาจัดเก็บได้ทันที</p>
                         <button onclick="navigateTo('map-view')" class="w-full py-3.5 bg-blue-600 text-white font-bold rounded-2xl shadow-lg shadow-blue-500/30 active:scale-95 transition-transform flex items-center justify-center">
                            <i class="fa-solid fa-map-location-dot mr-2"></i> เปิดแผนผังโรงเรียน
                         </button>
                    </div>
                </div>
            `;
        }

        function renderDashboardMapPins() {
            const container = document.getElementById('dashboard-map-pins');
            if (!container) return;
            // Updated Radar Pulse Dot for Dashboard
            container.innerHTML = binsData.map(bin => `
                <div class="absolute transform -translate-x-1/2 -translate-y-1/2" style="left: ${bin.x}%; top: ${bin.y}%;">
                    ${bin.status === 'full' 
                        ? `<div class="relative flex h-5 w-5 items-center justify-center">
                               <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-rose-400 opacity-80" style="animation-duration: 1.5s;"></span>
                               <span class="relative inline-flex rounded-full h-3 w-3 bg-rose-600 border border-white shadow-sm"></span>
                           </div>` 
                        : `<div class="w-2.5 h-2.5 rounded-full bg-emerald-500 border border-white shadow-sm"></div>`
                    }
                </div>
            `).join('');
        }

        function renderMapView() {
            return `
                <div class="flex-1 relative bg-slate-200 overflow-hidden flex items-center justify-center h-full pb-16">
                    <div class="absolute top-5 left-1/2 transform -translate-x-1/2 bg-white/95 backdrop-blur-md px-4 py-2 rounded-full shadow-lg text-center z-10 border border-slate-100 flex items-center whitespace-nowrap">
                        <span class="relative flex h-2.5 w-2.5 mr-2">
                          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-${currentRole==='student'?'blue':'emerald'}-400 opacity-75"></span>
                          <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-${currentRole==='student'?'blue':'emerald'}-500"></span>
                        </span>
                        <p class="text-xs font-bold text-slate-700">แตะที่หมุดบนแผนที่เพื่อดำเนินการ</p>
                    </div>
                    
                    <div id="map-pins-container" class="relative w-full max-w-[800px] aspect-[1.414/1] bg-white overflow-hidden shadow-2xl no-select">
                        <img src="https://placehold.co/800x565/f8fafc/cbd5e1?text=School+Map+Layout" class="w-full h-full object-cover">
                        
                        ${binsData.map(bin => `
                            <div onclick="openBinModal('${bin.id}')" class="absolute transform -translate-x-1/2 -translate-y-1/2 cursor-pointer z-10" style="left: ${bin.x}%; top: ${bin.y}%;">
                                ${bin.status === 'full' ? `
                                    <!-- New Radar Pulse Alert Pin -->
                                    <div class="relative flex flex-col items-center group">
                                        <div class="absolute -inset-4 bg-rose-500 rounded-full opacity-40 animate-pulse-ring"></div>
                                        <div class="absolute -inset-2 bg-rose-500 rounded-full opacity-60 animate-ping" style="animation-duration: 2s;"></div>
                                        <div class="w-10 h-10 rounded-full bg-gradient-to-br from-rose-500 to-rose-700 shadow-[0_5px_15px_rgba(225,29,72,0.6)] text-white flex items-center justify-center text-xl font-bold border-2 border-white relative z-10 transition-transform duration-300 group-hover:scale-110">
                                            <i class="fa-solid fa-trash-can-arrow-up"></i>
                                        </div>
                                        <div class="w-4 h-1.5 bg-black/30 rounded-full mt-2 blur-[2px]"></div>
                                    </div>
                                ` : `
                                    <!-- Normal Pin -->
                                    <div class="relative flex flex-col items-center group">
                                        <div class="w-8 h-8 rounded-full bg-gradient-to-br from-emerald-400 to-emerald-600 shadow-md text-white flex items-center justify-center text-sm font-bold border-[1.5px] border-white transition-transform duration-300 group-hover:scale-110 group-active:scale-95">
                                            <i class="fa-solid fa-check"></i>
                                        </div>
                                        <div class="w-2.5 h-1 bg-black/10 rounded-full mt-1 blur-[1px]"></div>
                                    </div>
                                `}
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderHistoryView() {
            const todayStr = new Date().toDateString();
            const todaysHistory = globalHistory.filter(item => item.dateStr === todayStr);
            const themeClass = currentRole === 'student' ? 'text-blue-600' : 'text-emerald-600';

            return `
                <div class="p-5 space-y-4 pb-24 h-full">
                    <div class="flex justify-between items-center mb-5 bg-white p-4 rounded-3xl shadow-sm border border-slate-100">
                        <div class="flex items-center">
                            <div class="w-10 h-10 rounded-xl bg-slate-50 flex items-center justify-center mr-3">
                                <i class="fa-solid fa-clock-rotate-left ${themeClass} text-lg"></i> 
                            </div>
                            <div>
                                <h2 class="font-bold text-sm text-slate-800">ประวัติของวันนี้</h2>
                                <p class="text-[10px] text-slate-500">ข้อมูลอัปเดตแบบ Real-time</p>
                            </div>
                        </div>
                        <span class="bg-slate-100 text-slate-600 text-xs font-bold px-3 py-1 rounded-full">${todaysHistory.length} รายการ</span>
                    </div>

                    ${todaysHistory.length === 0 ? `
                        <div class="bg-white p-10 rounded-3xl text-center border border-slate-100 shadow-sm mt-4 flex flex-col items-center justify-center h-[50vh]">
                            <div class="w-20 h-20 bg-slate-50 rounded-full flex items-center justify-center mb-4">
                                <i class="fa-solid fa-cloud-arrow-up text-slate-300 text-3xl"></i>
                            </div>
                            <h3 class="font-bold text-slate-700 text-sm mb-1">ยังไม่มีประวัติในวันนี้</h3>
                            <p class="text-xs text-slate-400">เมื่อมีการแจ้งเตือน ข้อมูลจะแสดงที่นี่ทันที</p>
                        </div>
                    ` : `
                        <div class="space-y-4 overflow-y-auto pb-10">
                            ${todaysHistory.map(item => `
                                <div class="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
                                    <div class="p-3.5 border-b border-slate-50 bg-slate-50/50 flex justify-between items-center">
                                        <div class="flex items-center space-x-2.5">
                                             <div class="w-7 h-7 rounded-full ${item.role === 'student' ? 'bg-rose-100 text-rose-600' : 'bg-emerald-100 text-emerald-600'} flex items-center justify-center shrink-0 shadow-inner">
                                                <i class="fa-solid ${item.role === 'student' ? 'fa-triangle-exclamation text-[10px]' : 'fa-check text-[11px]'}"></i>
                                            </div>
                                            <span class="font-bold text-xs ${item.role === 'student' ? 'text-rose-700' : 'text-emerald-700'}">${item.role === 'student' ? 'มีคนแจ้งขยะเต็ม' : 'แม่บ้านเคลียร์แล้ว'}</span>
                                        </div>
                                        <span class="text-[10px] text-slate-400 font-semibold bg-white px-2 py-1 rounded-md border border-slate-100 shadow-sm">${item.timestamp}</span>
                                    </div>
                                    <div class="p-4">
                                        <p class="text-xs font-bold text-slate-800 mb-3 flex items-center">
                                            <i class="fa-solid fa-location-dot text-slate-400 mr-2"></i> ${item.binName}
                                        </p>
                                        ${item.image ? `
                                            <div class="relative rounded-2xl overflow-hidden border border-slate-100 shadow-sm cursor-pointer group" onclick="openImageViewer('${item.image}')">
                                                <img src="${item.image}" class="w-full h-44 object-cover transform transition duration-500 group-hover:scale-105" alt="รูปภาพประวัติ" loading="lazy">
                                                <div class="absolute inset-0 bg-black/0 group-hover:bg-black/10 transition flex items-center justify-center">
                                                    <div class="w-10 h-10 rounded-full bg-white/90 backdrop-blur-sm text-slate-700 flex items-center justify-center opacity-0 group-hover:opacity-100 transition transform scale-75 group-hover:scale-100 shadow-lg">
                                                        <i class="fa-solid fa-magnifying-glass-plus"></i>
                                                    </div>
                                                </div>
                                            </div>
                                        ` : ''}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    `}
                </div>
            `;
        }

        function openBinModal(id) {
            selectedBinId = id;
            updateModalContent(id);
            document.getElementById('bin-modal').classList.remove('translate-y-full');
        }

        function updateModalContent(id) {
            const bin = binsData.find(b => b.id === id);
            if (!bin) return;

            // FIX for TypeError: Ensure elements exist before modifying
            const modalTitle = document.getElementById('modal-title');
            const modalLocation = document.getElementById('modal-location');
            const badge = document.getElementById('modal-status-badge');
            const actionBtn = document.getElementById('modal-action-btn');
            const actionText = document.getElementById('modal-action-text');

            if (!modalTitle || !modalLocation || !badge || !actionBtn || !actionText) return;

            modalTitle.innerText = bin.name;
            modalLocation.innerHTML = `<i class="fa-solid fa-location-dot text-emerald-500 mr-1.5"></i> ${bin.location}`;
            
            if (bin.status === 'full') {
                badge.className = "text-xs px-3 py-1 rounded-full font-bold bg-rose-100 text-rose-700 border border-rose-200";
                badge.innerHTML = `<i class="fa-solid fa-circle-exclamation mr-1"></i> เต็มแล้ว (รอเก็บ)`;
            } else {
                badge.className = "text-xs px-3 py-1 rounded-full font-bold bg-emerald-100 text-emerald-700 border border-emerald-200";
                badge.innerHTML = `<i class="fa-solid fa-circle-check mr-1"></i> ใช้งานปกติ`;
            }

            if (currentRole === 'housekeeper') {
                if (bin.status === 'full') {
                    actionBtn.className = "w-full py-4 rounded-2xl font-bold text-white text-base shadow-lg bg-emerald-600 hover:bg-emerald-700 shadow-emerald-500/30 active:scale-95 transition-all flex items-center justify-center space-x-2";
                    actionText.innerText = "ถ่ายรูปยืนยันว่าเก็บแล้ว";
                    actionBtn.querySelector('i').className = "fa-solid fa-camera text-lg";
                    actionBtn.disabled = false;
                } else {
                    actionBtn.className = "w-full py-4 rounded-2xl font-bold text-slate-400 text-base shadow-none bg-slate-200 cursor-not-allowed flex items-center justify-center space-x-2";
                    actionText.innerText = "ถังขยะใช้งานปกติ";
                    actionBtn.querySelector('i').className = "fa-solid fa-check-circle text-lg";
                    actionBtn.disabled = true;
                }
            } else {
                if (bin.status === 'full') {
                    actionBtn.className = "w-full py-4 rounded-2xl font-bold text-slate-500 text-base bg-slate-200 flex items-center justify-center space-x-2 cursor-not-allowed";
                    actionText.innerText = "มีการแจ้งเตือนไปแล้ว";
                    actionBtn.querySelector('i').className = "fa-solid fa-clock text-lg";
                    actionBtn.disabled = true;
                } else {
                    actionBtn.className = "w-full py-4 rounded-2xl font-bold text-white text-base shadow-lg bg-blue-600 hover:bg-blue-700 shadow-blue-500/30 active:scale-95 transition-all flex items-center justify-center space-x-2";
                    actionText.innerText = "ถ่ายรูประบุขยะเต็ม";
                    actionBtn.querySelector('i').className = "fa-solid fa-camera text-lg";
                    actionBtn.disabled = false;
                }
            }
        }

        function closeModal() {
            document.getElementById('bin-modal').classList.add('translate-y-full');
            setTimeout(() => { selectedBinId = null; }, 300);
        }

        window.openImageViewer = function(src) {
            document.getElementById('viewer-img').src = src;
            const viewer = document.getElementById('image-viewer');
            viewer.classList.remove('hidden');
            void viewer.offsetWidth;
            viewer.classList.remove('opacity-0');
        }
        window.closeImageViewer = function() {
            const viewer = document.getElementById('image-viewer');
            viewer.classList.add('opacity-0');
            setTimeout(() => { viewer.classList.add('hidden'); }, 300);
        }

        function handleModalAction() {
            if (isUploading) return;
            
            const actionText = document.getElementById('modal-action-text');
            const icon = document.querySelector('#modal-action-btn i');
            
            if (actionText) actionText.innerText = "กำลังเตรียมกล้อง...";
            if (icon) icon.className = "fa-solid fa-circle-notch fa-spin text-lg";
            
            setTimeout(() => {
                const fileInput = document.getElementById('camera-input');
                fileInput.value = ''; 
                fileInput.click();
                
                // ป้องกันกรณีผู้ใช้กดยกเลิกการเลือกรูปภาพ (รีเซ็ตปุ่มหลัง 3 วินาที)
                setTimeout(() => {
                    if(!isUploading && selectedBinId) {
                        updateModalContent(selectedBinId);
                    }
                }, 3000);
            }, 100);
        }

        async function processPhoto(event) {
            const file = event.target.files[0];
            if (!file) {
                if(selectedBinId) updateModalContent(selectedBinId);
                return;
            }
            
            isUploading = true;
            const actionText = document.getElementById('modal-action-text');
            const icon = document.querySelector('#modal-action-btn i');
            if (actionText) actionText.innerText = "กำลังอัปโหลดขึ้น Cloud...";
            if (icon) icon.className = "fa-solid fa-cloud-arrow-up fa-bounce text-lg";
            
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = async function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 500; 
                    let width = img.width;
                    let height = img.height;

                    if (width > height && width > MAX_WIDTH) {
                        height *= MAX_WIDTH / width;
                        width = MAX_WIDTH;
                    } else if (height > MAX_WIDTH) {
                        width *= MAX_WIDTH / height;
                        height = MAX_WIDTH;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.6); 

                    // แม่บ้านถ่ายรูป = normal (เก็บแล้ว), นักเรียนถ่ายรูป = full (ขยะเต็ม)
                    const newStatus = currentRole === 'housekeeper' ? 'normal' : 'full';
                    await uploadAlertData(compressedDataUrl, newStatus);
                };
                img.onerror = function() {
                    isUploading = false;
                    if(selectedBinId) updateModalContent(selectedBinId);
                    showToast("ข้อผิดพลาด", "ไฟล์รูปภาพไม่สมบูรณ์", "rose");
                };
                img.src = e.target.result;
            };
            reader.onerror = function() {
                isUploading = false;
                if(selectedBinId) updateModalContent(selectedBinId);
                showToast("ข้อผิดพลาด", "ไม่สามารถอ่านไฟล์ได้", "rose");
            };
            reader.readAsDataURL(file);
        }

        async function uploadAlertData(compressedDataUrl, newStatus) {
            const bin = binsData.find(b => b.id === selectedBinId);
            if (!bin) return;

            const now = new Date();
            const timeString = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')} น.`;
            const dateStr = now.toDateString();

            try {
                // Update Firestore directly without auth
                const statusDocRef = doc(db, 'binalert_data', 'statuses');
                await setDoc(statusDocRef, {
                    lastUpdatedDate: dateStr,
                    [bin.id]: { status: newStatus, time: timeString }
                }, { merge: true });

                const historyColRef = collection(db, 'binalert_history');
                await addDoc(historyColRef, {
                    role: currentRole,
                    timestamp: timeString,
                    timestampMs: Date.now(),
                    dateStr: dateStr,
                    image: compressedDataUrl,
                    binName: bin.name
                });

                if (currentRole === 'housekeeper') {
                    showToast("อัปเดตเรียบร้อย", "บันทึกข้อมูลเคลียร์จุดขยะแล้ว", "emerald");
                } else {
                    showToast("แจ้งเตือนสำเร็จ", "ส่งข้อมูลให้แม่บ้านแบบ Real-time แล้ว", "blue");
                }
            } catch (error) {
                console.error("Firebase Error:", error);
                showToast("เกิดข้อผิดพลาด", "ไม่สามารถส่งข้อมูลได้ กรุณาลองใหม่", "rose");
            }

            isUploading = false;
            closeModal();
        }

        function showToast(title, message, theme) {
            const toast = document.getElementById('toast');
            if(!toast) return;
            const iconBg = document.getElementById('toast-icon-bg');
            const icon = document.getElementById('toast-icon');

            document.getElementById('toast-title').innerText = title;
            document.getElementById('toast-message').innerText = message;

            if (theme === 'blue') {
                iconBg.className = "w-10 h-10 rounded-xl bg-blue-500 text-white flex items-center justify-center shrink-0 shadow-inner";
                icon.className = "fa-solid fa-paper-plane text-base";
            } else if (theme === 'rose') {
                iconBg.className = "w-10 h-10 rounded-xl bg-rose-500 text-white flex items-center justify-center shrink-0 shadow-inner";
                icon.className = "fa-solid fa-triangle-exclamation text-base";
            } else {
                iconBg.className = "w-10 h-10 rounded-xl bg-emerald-500 text-white flex items-center justify-center shrink-0 shadow-inner";
                icon.className = "fa-solid fa-check text-base";
            }

            toast.classList.remove('-translate-y-32', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('-translate-y-32', 'opacity-0');
            }, 3000);
        }

        window.setRole = setRole;
        window.switchRolePrompt = switchRolePrompt;
        window.navigateTo = navigateTo;
        window.goBack = goBack;
        window.openBinModal = openBinModal;
        window.closeModal = closeModal;
        window.handleModalAction = handleModalAction;
        window.processPhoto = processPhoto;

    </script>
</body>
</html>
