<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BinAlert - ระบบแจ้งเตือนขยะโรงเรียนจักรคำคณาทร</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { sans: ['Prompt', 'sans-serif'] } } }
        }
    </script>
    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #0f172a; margin: 0; overflow: hidden; }
        
        .phone-frame {
            width: 100%;
            height: 100vh;
            height: 100dvh; 
            background: #ffffff;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: none;
            border-radius: 0;
        }
        
        @media (min-width: 480px) {
            .phone-frame {
                max-width: 390px;
                height: 90vh;
                max-height: 844px;
                border-radius: 40px;
                border: 8px solid #334155;
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            }
        }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
        .no-select { user-select: none; -webkit-user-select: none; }
        
        #db-loading {
            position: absolute; inset: 0; background: rgba(255,255,255,0.9); z-index: 100;
            display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
        }
    </style>
</head>
<body class="h-screen flex items-center justify-center sm:p-4">

    <div class="phone-frame">
        
        <!-- App Header -->
        <header id="app-header" class="bg-slate-900 text-white px-5 py-4 flex justify-between items-center shadow-md z-20 shrink-0 hidden">
            <div class="flex items-center space-x-3">
                <button id="back-btn" onclick="goBack()" class="w-9 h-9 rounded-full bg-slate-800 hover:bg-slate-700 flex items-center justify-center text-white transition hidden">
                    <i class="fa-solid fa-arrow-left text-sm"></i>
                </button>
                <div>
                    <h1 id="header-title" class="font-bold text-base leading-tight">BinAlert</h1>
                    <p id="header-subtitle" class="text-[11px] text-slate-400">ระบบคลาวด์</p>
                </div>
            </div>
            <button id="switch-role-btn" onclick="switchRolePrompt()" class="bg-slate-800 hover:bg-slate-700 text-emerald-400 text-xs px-2.5 py-1.5 rounded-full font-medium border border-slate-700 flex items-center space-x-1 transition hidden">
                <i class="fa-solid fa-right-left text-[10px]"></i>
                <span id="role-badge-text">เปลี่ยนบทบาท</span>
            </button>
        </header>

        <!-- Main Content Area -->
        <div id="main-content" class="flex-1 overflow-y-auto bg-slate-50 relative flex flex-col">
            <!-- Loading Screen while connecting to Firebase -->
            <div id="db-loading" class="flex flex-col items-center justify-center h-full">
                <div class="w-12 h-12 border-4 border-emerald-200 border-t-emerald-600 rounded-full animate-spin mb-4"></div>
                <p class="text-sm font-bold text-slate-700">กำลังเชื่อมต่อฐานข้อมูล...</p>
                <p class="text-xs text-slate-500 mt-1">Real-time Cloud Sync</p>
            </div>
        </div>

        <!-- Bottom Navigation Bar -->
        <nav id="bottom-nav" class="bg-white border-t border-slate-200 px-6 py-3 flex justify-around items-center z-20 shrink-0 shadow-[0_-5px_15px_rgba(0,0,0,0.05)] hidden">
        </nav>

        <input type="file" id="camera-input" accept="image/*" capture="environment" class="hidden" onchange="processPhoto(event)">

        <!-- Bottom Sheet Modal (Map Pin Click - Simplified) -->
        <div id="bin-modal" class="absolute inset-x-0 bottom-0 bg-white rounded-t-3xl shadow-[0_-10px_40px_rgba(0,0,0,0.15)] border-t border-slate-200 p-6 z-50 transform translate-y-full transition-transform duration-300 flex flex-col min-h-[30%]">
            <div class="w-12 h-1.5 bg-slate-300 rounded-full mx-auto mb-5 shrink-0"></div>
            
            <div class="flex justify-between items-start mb-6 shrink-0">
                <div>
                    <span id="modal-status-badge" class="text-xs px-3 py-1 rounded-full font-semibold">ปกติ</span>
                    <h3 id="modal-title" class="font-bold text-xl text-slate-900 mt-2">ชื่อจุดถังขยะ</h3>
                    <p id="modal-location" class="text-sm text-slate-500 mt-1"><i class="fa-solid fa-location-dot text-emerald-600 mr-1"></i> ตำแหน่ง</p>
                </div>
                <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-500 flex items-center justify-center transition shrink-0">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            
            <div class="w-full shrink-0 pb-4">
                <button id="modal-action-btn" onclick="handleModalAction()" class="w-full py-4 rounded-2xl font-bold text-white text-base shadow-lg transition flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-camera"></i>
                    <span id="modal-action-text">บันทึกรูปภาพ</span>
                </button>
            </div>
        </div>

        <!-- Toast Notification -->
        <div id="toast" class="absolute top-6 inset-x-6 bg-slate-900 text-white px-4 py-3 rounded-2xl shadow-2xl z-50 transform -translate-y-24 opacity-0 transition-all duration-300 flex items-center space-x-3 border border-slate-700 pointer-events-none">
            <div id="toast-icon-bg" class="w-8 h-8 rounded-xl bg-emerald-600 text-white flex items-center justify-center shrink-0">
                <i id="toast-icon" class="fa-solid fa-check text-sm"></i>
            </div>
            <div>
                <h4 id="toast-title" class="font-bold text-xs">สำเร็จ</h4>
                <p id="toast-message" class="text-[11px] text-slate-300">ระบบคลาวด์อัปเดตแล้ว</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection, addDoc, getDocs, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Configuration
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-binalert';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "mock", authDomain: "mock", projectId: "mock", storageBucket: "mock", messagingSenderId: "mock", appId: "mock"
        };
        
        let app, db, auth, currentUser;

        // Make functions globally available
        window.setRole = setRole;
        window.switchRolePrompt = switchRolePrompt;
        window.navigateTo = navigateTo;
        window.goBack = goBack;
        window.openBinModal = openBinModal;
        window.closeModal = closeModal;
        window.handleModalAction = handleModalAction;
        window.processPhoto = processPhoto;
        window.requestNotificationPermission = requestNotificationPermission;

        // Data Models
        const defaultBinsData = [
            { id: "bin_1", name: "จุดถังขยะ อาคารโดม", location: "บริเวณโดม 115 ปี (จุดที่ 12)", status: "normal", reporter: null, time: null, x: 53, y: 38 },
            { id: "bin_2", name: "จุดถังขยะ สนามฟุตบอล", location: "ข้างสนามฟุตบอล / ลู่วิ่ง", status: "normal", reporter: null, time: null, x: 25, y: 72 },
            { id: "bin_3", name: "จุดถังขยะ หน้าอาคาร 4", location: "อาคารพิศาลโสภาคคุณ (อาคาร 4)", status: "normal", reporter: null, time: null, x: 58, y: 78 }
        ];

        let binsData = [];
        let globalHistory = [];
        let currentRole = null; 
        let currentScreen = 'role-select'; 
        let selectedBinId = null;
        let isUploading = false;
        let notificationsEnabled = false;
        let lastReportedBinName = "";

        async function initApp() {
            try {
                if (firebaseConfig.apiKey === 'mock') {
                    console.log("Running in local mock mode.");
                    binsData = [...defaultBinsData];
                    document.getElementById('db-loading').classList.add('hidden');
                    renderApp();
                    return;
                }

                app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);

                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                currentUser = auth.currentUser;
                
                await seedDatabaseIfNeeded();
                setupRealtimeListeners();
                
                // Hide loading screen and show the app
                document.getElementById('db-loading').classList.add('hidden');
                renderApp();
                
            } catch (error) {
                console.error("Firebase init error:", error);
                binsData = [...defaultBinsData];
                document.getElementById('db-loading').classList.add('hidden');
                renderApp();
            }
        }

        function getBinsCollection() { return collection(db, 'artifacts', appId, 'public', 'data', 'bins'); }
        function getHistoryCollection() { return collection(db, 'artifacts', appId, 'public', 'data', 'history'); }

        async function seedDatabaseIfNeeded() {
            if(!currentUser) return;
            const snapshot = await getDocs(getBinsCollection());
            if (snapshot.empty) {
                console.log("Seeding initial bin data...");
                for (const bin of defaultBinsData) {
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'bins', bin.id);
                    await setDoc(docRef, bin);
                }
            }
        }

        function setupRealtimeListeners() {
            if(!currentUser) return;

            // Bins Listener
            onSnapshot(getBinsCollection(), (snapshot) => {
                binsData = [];
                let newlyFullBin = null;

                snapshot.forEach((doc) => {
                    const data = doc.data();
                    binsData.push({ ...data, docId: doc.id });
                    
                    // Check if a bin was just marked as full (for notification)
                    if(data.status === 'full' && data.name !== lastReportedBinName) {
                        newlyFullBin = data.name;
                    }
                });
                binsData.sort((a,b) => a.id.localeCompare(b.id));
                
                if(currentScreen !== 'role-select') renderApp();

                // Trigger Notification if Housekeeper
                if(currentRole === 'housekeeper' && newlyFullBin && newlyFullBin !== lastReportedBinName) {
                    triggerPushNotification("แจ้งเตือนถังขยะเต็ม!", `นักเรียนได้แจ้งว่า ${newlyFullBin} เต็มแล้ว กรุณาตรวจสอบ`);
                    lastReportedBinName = newlyFullBin; // Prevent duplicate alerts
                }

            }, (error) => console.error("Bins Listener Error:", error));

            // History Listener
            onSnapshot(getHistoryCollection(), (snapshot) => {
                let tempHistory = [];
                snapshot.forEach((doc) => {
                    tempHistory.push({ ...doc.data(), docId: doc.id });
                });
                tempHistory.sort((a,b) => b.timestamp_ms - a.timestamp_ms);
                globalHistory = tempHistory;
                
                if(currentScreen === 'history-view') renderApp();
            }, (error) => console.error("History Listener Error:", error));
        }

        // --- Notification System ---
        function requestNotificationPermission() {
            if (!("Notification" in window)) {
                console.log("This browser does not support desktop notification");
                return;
            }
            if (Notification.permission === "granted") {
                notificationsEnabled = true;
            } else if (Notification.permission !== "denied") {
                Notification.requestPermission().then(permission => {
                    if (permission === "granted") {
                        notificationsEnabled = true;
                        showToast("เปิดแจ้งเตือนสำเร็จ", "คุณจะได้รับการแจ้งเตือนเมื่อมีนักเรียนแจ้งขยะเต็ม", "emerald");
                    }
                });
            }
        }

        function triggerPushNotification(title, body) {
            if (notificationsEnabled && Notification.permission === "granted") {
                const options = {
                    body: body,
                    icon: "https://cdn-icons-png.flaticon.com/512/3299/3299935.png", // Generic bin icon
                    vibrate: [200, 100, 200]
                };
                new Notification(title, options);
            }
        }

        function setRole(role) {
            currentRole = role;
            currentScreen = (role === 'housekeeper') ? 'housekeeper-home' : 'student-home';
            
            // Ask for notification permission if housekeeper
            if(role === 'housekeeper' && !notificationsEnabled) {
                setTimeout(requestNotificationPermission, 1000);
            }
            
            renderApp();
        }

        function switchRolePrompt() {
            currentRole = null;
            currentScreen = 'role-select';
            renderApp();
        }

        function navigateTo(screen) {
            currentScreen = screen;
            closeModal();
            renderApp();
        }

        function goBack() {
            closeModal();
            navigateTo(currentRole === 'housekeeper' ? 'housekeeper-home' : 'student-home');
        }

        function renderApp() {
            const content = document.getElementById('main-content');
            const bottomNav = document.getElementById('bottom-nav');
            const appHeader = document.getElementById('app-header');
            const backBtn = document.getElementById('back-btn');
            const switchRoleBtn = document.getElementById('switch-role-btn');

            if (currentScreen === 'role-select') {
                appHeader.classList.add('hidden');
                bottomNav.classList.add('hidden');
                content.innerHTML = renderRoleSelectScreen();
                return;
            } else {
                appHeader.classList.remove('hidden');
            }

            if (currentScreen === 'housekeeper-home' || currentScreen === 'student-home') {
                backBtn.classList.add('hidden');
                switchRoleBtn.classList.remove('hidden');
            } else {
                backBtn.classList.remove('hidden');
                switchRoleBtn.classList.add('hidden');
            }

            if (currentScreen === 'housekeeper-home') {
                content.innerHTML = renderHousekeeperDashboard();
                bottomNav.innerHTML = renderHousekeeperNav();
                bottomNav.classList.remove('hidden');
                renderDashboardMapPins(); 
            } else if (currentScreen === 'student-home') {
                content.innerHTML = renderStudentDashboard();
                bottomNav.innerHTML = renderStudentNav();
                bottomNav.classList.remove('hidden');
            } else if (currentScreen === 'map-view') {
                content.innerHTML = renderMapView();
                bottomNav.innerHTML = currentRole === 'housekeeper' ? renderHousekeeperNav() : renderStudentNav();
                bottomNav.classList.remove('hidden');
            } else if (currentScreen === 'history-view') {
                content.innerHTML = renderHistoryView();
                bottomNav.innerHTML = currentRole === 'housekeeper' ? renderHousekeeperNav() : renderStudentNav();
                bottomNav.classList.remove('hidden');
            }
        }

        function renderRoleSelectScreen() {
            return `
                <div class="flex-1 bg-slate-900 flex flex-col items-center justify-center p-6 text-white text-center relative h-full">
                    <div class="w-full max-w-sm flex flex-col items-center justify-center">
                        <div class="mb-12 text-center">
                            <div class="w-24 h-24 bg-emerald-500 rounded-[2rem] flex items-center justify-center text-4xl shadow-xl shadow-emerald-500/20 mx-auto mb-4">
                                <i class="fa-solid fa-leaf"></i>
                            </div>
                            <h1 class="text-3xl font-bold tracking-tight mb-1">BinAlert</h1>
                            <p class="text-[11px] text-slate-400">โรงเรียนจักรคำคณาทร</p>
                        </div>
                        <div class="space-y-4 w-full px-2">
                            <button onclick="setRole('student')" class="w-full bg-slate-800/80 hover:bg-slate-700/80 border border-slate-700 p-4 rounded-2xl flex items-center space-x-4 transition">
                                <div class="w-12 h-12 rounded-xl bg-blue-500/20 text-blue-400 flex items-center justify-center text-xl shrink-0">
                                    <i class="fa-solid fa-user-graduate"></i>
                                </div>
                                <div class="text-left">
                                    <h3 class="font-bold text-sm">นักเรียน</h3>
                                    <p class="text-[11px] text-slate-400 mt-0.5">ช่วยแจ้งเตือนขยะเต็มด้วยรูปถ่าย</p>
                                </div>
                            </button>
                            <button onclick="setRole('housekeeper')" class="w-full bg-slate-800/80 hover:bg-slate-700/80 border border-slate-700 p-4 rounded-2xl flex items-center space-x-4 transition">
                                <div class="w-12 h-12 rounded-xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-xl shrink-0">
                                    <i class="fa-solid fa-broom"></i>
                                </div>
                                <div class="text-left">
                                    <h3 class="font-bold text-sm">แม่บ้าน</h3>
                                    <p class="text-[11px] text-slate-400 mt-0.5">ตรวจสอบและถ่ายรูปยืนยันการเก็บ</p>
                                </div>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderHousekeeperDashboard() {
            const urgentCount = binsData.filter(b => b.status === 'full').length;
            const normalCount = binsData.filter(b => b.status === 'normal').length;
            return `
                <div class="p-5 space-y-5 pb-20">
                    <div class="bg-gradient-to-r from-emerald-600 to-teal-700 text-white p-5 rounded-2xl shadow-lg relative overflow-hidden">
                        <div class="relative z-10 flex items-center space-x-4">
                            <div class="w-12 h-12 bg-white/20 rounded-xl flex items-center justify-center shrink-0">
                                <i class="fa-solid fa-broom text-2xl"></i>
                            </div>
                            <div>
                                <h2 class="font-bold text-lg">โหมดแม่บ้าน</h2>
                                <p class="text-[11px] text-emerald-100 mt-0.5 leading-tight">ตรวจสอบแจ้งเตือนจากนักเรียน และอัปโหลดภาพยืนยันการจัดเก็บ</p>
                            </div>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div class="bg-emerald-50 text-emerald-700 p-4 rounded-2xl border border-emerald-200">
                            <span class="text-2xl font-bold block">${normalCount}</span>
                            <span class="text-xs font-medium">จุดปกติ (ว่าง)</span>
                        </div>
                        <div class="bg-rose-50 text-rose-700 p-4 rounded-2xl border border-rose-200">
                            <span class="text-2xl font-bold block">${urgentCount}</span>
                            <span class="text-xs font-medium">ต้องเก็บด่วน</span>
                        </div>
                    </div>
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                        <div class="flex justify-between items-center mb-3">
                            <h2 class="font-bold text-sm text-slate-800">ภาพรวมพื้นที่</h2>
                            <button onclick="navigateTo('map-view')" class="text-xs font-bold text-emerald-600 hover:text-emerald-700 flex items-center">
                                ดูแผนที่ <i class="fa-solid fa-chevron-right ml-1 text-[10px]"></i>
                            </button>
                        </div>
                        <div onclick="navigateTo('map-view')" class="relative w-full h-44 rounded-xl overflow-hidden border border-slate-200 cursor-pointer bg-slate-100">
                            <img src="map-image.jpg" onerror="this.src='https://placehold.co/600x350/e2e8f0/94a3b8?text=Map+Overview'" class="w-full h-full object-cover opacity-60">
                            <div id="dashboard-map-pins" class="absolute inset-0"></div>
                        </div>
                    </div>
                    <div>
                        <h3 class="font-bold text-sm text-slate-800 mb-3 flex items-center">
                            <i class="fa-solid fa-bell text-rose-500 mr-2"></i> รายการด่วน
                        </h3>
                        <div class="space-y-2.5">
                            ${urgentCount === 0 ? `
                                <div class="bg-white p-6 rounded-2xl text-center border border-slate-200 shadow-sm">
                                    <i class="fa-regular fa-circle-check text-emerald-500 text-3xl mb-2"></i>
                                    <p class="text-xs font-bold text-slate-700">เยี่ยมมาก! ไม่มีถังขยะเต็ม</p>
                                </div>
                            ` : binsData.filter(b => b.status === 'full').map(bin => `
                                <div onclick="navigateTo('map-view'); setTimeout(()=>openBinModal('${bin.id}'), 100);" class="bg-rose-50 border border-rose-200 p-3.5 rounded-2xl flex items-center justify-between cursor-pointer">
                                    <div class="flex items-center space-x-3">
                                        <div class="w-10 h-10 rounded-xl bg-rose-500 text-white flex items-center justify-center shadow"><i class="fa-solid fa-triangle-exclamation"></i></div>
                                        <div>
                                            <h4 class="font-bold text-xs text-slate-800">${bin.name}</h4>
                                            <p class="text-[10px] text-rose-700 mt-0.5">แจ้งเมื่อ: ${bin.time || 'ไม่ระบุ'}</p>
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderStudentDashboard() {
            return `
                <div class="p-5 space-y-5 pb-20">
                    <div class="bg-gradient-to-r from-blue-600 to-indigo-700 text-white p-5 rounded-2xl shadow-lg relative overflow-hidden">
                        <div class="relative z-10 flex items-center space-x-4">
                            <div class="w-12 h-12 bg-white/20 rounded-xl flex items-center justify-center shrink-0">
                                <i class="fa-solid fa-user-graduate text-2xl"></i>
                            </div>
                            <div>
                                <h2 class="font-bold text-lg">นักเรียน</h2>
                                <p class="text-[11px] text-blue-100 mt-0.5 leading-tight">ช่วยโรงเรียนสะอาด ถ่ายรูปแจ้งเตือนเมื่อพบถังขยะล้นให้แม่บ้านทราบ</p>
                            </div>
                        </div>
                    </div>
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                        <div class="flex justify-between items-center mb-3">
                            <h3 class="font-bold text-sm text-slate-800">แผนผังจุดทิ้งขยะ</h3>
                            <button onclick="navigateTo('map-view')" class="text-xs font-bold text-blue-600 hover:text-blue-700 flex items-center">
                                เปิดแผนที่ <i class="fa-solid fa-chevron-right ml-1 text-[10px]"></i>
                            </button>
                        </div>
                        <div onclick="navigateTo('map-view')" class="relative w-full h-48 rounded-xl overflow-hidden border border-slate-200 cursor-pointer group bg-slate-100">
                            <img src="map-image.jpg" onerror="this.src='https://placehold.co/600x350/e2e8f0/94a3b8?text=Map'" class="w-full h-full object-cover opacity-70 group-hover:scale-105 transition duration-500">
                            <div class="absolute inset-0 bg-slate-900/10 flex items-center justify-center">
                                <span class="bg-blue-600 text-white text-xs font-bold px-4 py-2 rounded-full shadow-lg flex items-center">
                                    <i class="fa-solid fa-camera mr-1.5"></i> เลือกจุดถ่ายรูปแจ้งเตือน
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderDashboardMapPins() {
            const container = document.getElementById('dashboard-map-pins');
            if (!container) return;
            container.innerHTML = binsData.map(bin => `
                <div class="absolute transform -translate-x-1/2 -translate-y-1/2" style="left: ${bin.x}%; top: ${bin.y}%;">
                    <div class="w-3 h-3 rounded-full ${bin.status === 'full' ? 'bg-rose-500 animate-ping' : 'bg-emerald-500'} border-2 border-white shadow-md"></div>
                </div>
            `).join('');
        }

        function renderMapView() {
            return `
                <div class="flex-1 relative bg-[#e2e8f0] overflow-hidden flex items-center justify-center h-full">
                    <div class="relative w-full max-w-[800px] aspect-[1.414/1] bg-white overflow-hidden shadow-xl no-select">
                        <img src="map-image.jpg" onerror="this.src='https://placehold.co/800x565/f8fafc/1e293b?text=Map+Image+Not+Found'" class="w-full h-full object-contain">
                        ${binsData.map(bin => `
                            <div onclick="openBinModal('${bin.id}')" class="absolute transform -translate-x-1/2 -translate-y-1/2 cursor-pointer z-10" style="left: ${bin.x}%; top: ${bin.y}%;">
                                <div class="relative flex flex-col items-center">
                                    <div class="w-8 h-8 rounded-full ${bin.status === 'full' ? 'bg-rose-500 shadow-[0_0_15px_rgba(244,63,94,0.6)]' : 'bg-emerald-500 shadow-md'} text-white flex items-center justify-center text-sm font-bold border-2 border-white">
                                        <i class="fa-solid ${bin.status === 'full' ? 'fa-triangle-exclamation' : 'fa-check'}"></i>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderHistoryView() {
            return `
                <div class="p-5 space-y-4 pb-20">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="font-bold text-lg text-slate-800 flex items-center">
                            <i class="fa-solid fa-clock-rotate-left mr-2 ${currentRole === 'student' ? 'text-blue-500' : 'text-emerald-500'}"></i> 
                            ประวัติการแจ้งและการเก็บ
                        </h2>
                    </div>

                    ${globalHistory.length === 0 ? `
                        <div class="bg-white p-8 rounded-2xl text-center border border-slate-200 shadow-sm mt-10">
                            <i class="fa-solid fa-folder-open text-slate-300 text-3xl mb-2"></i>
                            <h3 class="font-bold text-slate-700 text-sm mb-1">ยังไม่มีประวัติรูปภาพ</h3>
                        </div>
                    ` : `
                        <div class="space-y-4">
                            ${globalHistory.map(item => `
                                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                                    <div class="p-3 border-b border-slate-100 bg-slate-50 flex justify-between items-center">
                                        <div class="flex items-center space-x-2">
                                             <div class="w-6 h-6 rounded-full ${item.role === 'student' ? 'bg-blue-100 text-blue-600' : 'bg-emerald-100 text-emerald-600'} flex items-center justify-center shrink-0">
                                                <i class="fa-solid ${item.role === 'student' ? 'fa-user-graduate text-[10px]' : 'fa-broom text-[10px]'}"></i>
                                            </div>
                                            <span class="font-bold text-xs text-slate-700">${item.role === 'student' ? 'นักเรียนแจ้งเต็ม' : 'แม่บ้านเก็บแล้ว'}</span>
                                        </div>
                                        <span class="text-[10px] text-slate-400 font-medium">${item.timestamp}</span>
                                    </div>
                                    <div class="p-3">
                                        <p class="text-xs font-semibold text-slate-800 mb-2">${item.binName}</p>
                                        ${item.image ? `<img src="${item.image}" class="w-full h-40 object-cover rounded-xl border border-slate-200 shadow-sm" alt="รูปภาพประวัติ">` : ''}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    `}
                </div>
            `;
        }

        function renderHousekeeperNav() {
            return `
                <button onclick="navigateTo('housekeeper-home')" class="flex flex-col items-center w-20 ${currentScreen === 'housekeeper-home' ? 'text-emerald-600' : 'text-slate-400'} transition">
                    <i class="fa-solid fa-house text-lg mb-1"></i><span class="text-[10px]">หน้าแรก</span>
                </button>
                <button onclick="navigateTo('history-view')" class="flex flex-col items-center w-20 ${currentScreen === 'history-view' ? 'text-emerald-600' : 'text-slate-400'} transition -mt-5">
                    <div class="w-12 h-12 bg-emerald-500 text-white rounded-full flex items-center justify-center shadow-lg shadow-emerald-500/40 border-4 border-white">
                        <i class="fa-solid fa-clock-rotate-left text-lg"></i>
                    </div><span class="text-[10px] mt-1 text-slate-600">ประวัติ</span>
                </button>
                <button onclick="navigateTo('map-view')" class="flex flex-col items-center w-20 ${currentScreen === 'map-view' ? 'text-emerald-600' : 'text-slate-400'} transition">
                    <i class="fa-solid fa-map text-lg mb-1"></i><span class="text-[10px]">แผนผัง</span>
                </button>
            `;
        }

        function renderStudentNav() {
            return `
                <button onclick="navigateTo('student-home')" class="flex flex-col items-center w-20 ${currentScreen === 'student-home' ? 'text-blue-600' : 'text-slate-400'} transition">
                    <i class="fa-solid fa-house text-lg mb-1"></i><span class="text-[10px]">หน้าแรก</span>
                </button>
                <button onclick="navigateTo('map-view')" class="flex flex-col items-center w-20 ${currentScreen === 'map-view' ? 'text-blue-600' : 'text-slate-400'} transition -mt-5">
                    <div class="w-12 h-12 bg-blue-600 text-white rounded-full flex items-center justify-center shadow-lg shadow-blue-500/40 border-4 border-white">
                        <i class="fa-solid fa-camera text-lg"></i>
                    </div><span class="text-[10px] mt-1 text-slate-600">แจ้งขยะ</span>
                </button>
                 <button onclick="navigateTo('history-view')" class="flex flex-col items-center w-20 ${currentScreen === 'history-view' ? 'text-blue-600' : 'text-slate-400'} transition">
                    <i class="fa-solid fa-clock-rotate-left text-lg mb-1"></i><span class="text-[10px]">ประวัติ</span>
                </button>
            `;
        }

        function openBinModal(id) {
            selectedBinId = id;
            const bin = binsData.find(b => b.id === id);
            if (!bin) return;

            document.getElementById('modal-title').innerText = bin.name;
            document.getElementById('modal-location').innerHTML = `<i class="fa-solid fa-location-dot text-emerald-600 mr-1"></i> ${bin.location}`;
            
            const badge = document.getElementById('modal-status-badge');
            const actionBtn = document.getElementById('modal-action-btn');
            const actionText = document.getElementById('modal-action-text');

            if (bin.status === 'full') {
                badge.className = "text-xs px-3 py-1 rounded-full font-semibold bg-rose-100 text-rose-700";
                badge.innerText = "เต็มแล้ว";
            } else {
                badge.className = "text-xs px-3 py-1 rounded-full font-semibold bg-emerald-100 text-emerald-700";
                badge.innerText = "ใช้งานปกติ";
            }

            if (currentRole === 'housekeeper') {
                actionBtn.className = "w-full py-4 rounded-2xl font-bold text-white text-base shadow-lg transition flex items-center justify-center space-x-2 " + (bin.status === 'full' ? "bg-emerald-600 hover:bg-emerald-700" : "bg-slate-300 opacity-50 cursor-not-allowed");
                actionText.innerText = "📸 ถ่ายรูปยืนยันการเก็บขยะ";
                actionBtn.disabled = bin.status !== 'full';
            } else {
                if (bin.status === 'full') {
                    actionBtn.className = "w-full py-4 rounded-2xl font-bold text-white text-base shadow-none bg-slate-300 cursor-not-allowed flex items-center justify-center space-x-2";
                    actionText.innerText = "มีการแจ้งเตือนไปแล้ว";
                    actionBtn.disabled = true;
                } else {
                    actionBtn.className = "w-full py-4 rounded-2xl font-bold text-white text-base shadow-lg bg-blue-600 hover:bg-blue-700 flex items-center justify-center space-x-2";
                    actionText.innerText = "📸 ถ่ายรูประบุขยะเต็ม";
                    actionBtn.disabled = false;
                }
            }

            document.getElementById('bin-modal').classList.remove('translate-y-full');
        }

        function closeModal() {
            document.getElementById('bin-modal').classList.add('translate-y-full');
            selectedBinId = null;
        }

        function handleModalAction() {
            if(isUploading) return;
            document.getElementById('camera-input').click();
        }

        function getCompressedBase64(file, callback) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 400; // Small size for fast cloud sync
                    const scaleSize = MAX_WIDTH / img.width;
                    canvas.width = MAX_WIDTH;
                    canvas.height = img.height * scaleSize;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.6); 
                    callback(dataUrl);
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

        async function processPhoto(event) {
            const file = event.target.files[0];
            if (!file) return;

            const bin = binsData.find(b => b.id === selectedBinId);
            if (!bin || !currentUser) return;

            isUploading = true;
            document.getElementById('modal-action-text').innerText = "กำลังอัปโหลดคลาวด์...";
            
            const now = new Date();
            const timeString = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')} น.`;
            const timestampMs = now.getTime();

            getCompressedBase64(file, async (compressedImage) => {
                try {
                    const binRef = doc(db, 'artifacts', appId, 'public', 'data', 'bins', bin.docId || bin.id);
                    
                    if (currentRole === 'housekeeper') {
                        await updateDoc(binRef, { status: 'normal', reporter: null, time: null });
                        
                        await addDoc(getHistoryCollection(), {
                            role: 'housekeeper',
                            timestamp: timeString,
                            timestamp_ms: timestampMs,
                            image: compressedImage,
                            binName: bin.name
                        });
                        showToast("อัปเดตเรียบร้อย", `บันทึกรูปและเปลี่ยนสถานะในระบบแล้ว`, 'emerald');
                        lastReportedBinName = ""; // Reset the alert flag for this bin
                    } else {
                        await updateDoc(binRef, { status: 'full', reporter: "นักเรียน", time: timeString });
                        
                        await addDoc(getHistoryCollection(), {
                            role: 'student',
                            timestamp: timeString,
                            timestamp_ms: timestampMs,
                            image: compressedImage,
                            binName: bin.name
                        });
                        showToast("แจ้งเตือนสำเร็จ", `ส่งข้อมูลเรียลไทม์ถึงแม่บ้านแล้ว`, 'blue');
                    }
                } catch (error) {
                    console.error("Error saving data:", error);
                    alert("เกิดข้อผิดพลาดในการเชื่อมต่อฐานข้อมูล");
                } finally {
                    isUploading = false;
                    event.target.value = '';
                    closeModal();
                }
            });
        }

        function showToast(title, message, theme) {
            const toast = document.getElementById('toast');
            const iconBg = document.getElementById('toast-icon-bg');
            const icon = document.getElementById('toast-icon');

            document.getElementById('toast-title').innerText = title;
            document.getElementById('toast-message').innerText = message;

            if (theme === 'blue') {
                iconBg.className = "w-8 h-8 rounded-xl bg-blue-600 text-white flex items-center justify-center shrink-0";
                icon.className = "fa-solid fa-paper-plane text-sm";
            } else {
                iconBg.className = "w-8 h-8 rounded-xl bg-emerald-600 text-white flex items-center justify-center shrink-0";
                icon.className = "fa-solid fa-cloud-arrow-up text-sm";
            }

            toast.classList.remove('-translate-y-24', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('-translate-y-24', 'opacity-0');
            }, 3000);
        }

        // Run initialization
        initApp();
    </script>
</body>
