<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BinAlert - ระบบแจ้งเตือนขยะโรงเรียน</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Sarabun', sans-serif; -webkit-tap-highlight-color: transparent; }
        #map { height: 65vh; width: 100%; border-radius: 1rem; z-index: 10; }
        .custom-popup .leaflet-popup-content-wrapper { border-radius: 1rem; padding: 0; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">

    <!-- Header -->
    <header class="bg-emerald-600 text-white p-4 shadow-md sticky top-0 z-50 flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <i class="fa-solid fa-recycle text-2xl animate-spin" style="animation-duration: 8s;"></i>
            <h1 class="text-xl font-bold tracking-wide">BinAlert</h1>
        </div>
        <div class="flex bg-emerald-700 p-1 rounded-xl shadow-inner">
            <button id="btnStudent" onclick="switchMode('student')" class="px-3 py-1.5 rounded-lg text-sm font-medium transition-all bg-white text-emerald-700 shadow">นักเรียน</button>
            <button id="btnCleaner" onclick="switchMode('cleaner')" class="px-3 py-1.5 rounded-lg text-sm font-medium transition-all text-white">แม่บ้าน</button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 p-4 max-w-md mx-auto w-full pb-24">
        <!-- แผนที่แสดงจุดถังขยะ -->
        <div class="mb-4 shadow-lg rounded-2xl overflow-hidden border border-slate-200">
            <div id="map"></div>
        </div>

        <!-- สถานะและปุ่มควบคุม -->
        <div id="actionContainer" class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 text-center">
            <div id="statusInfo" class="mb-3 text-sm text-slate-500">กรุณาเลือกจุดถังขยะบนแผนที่ด้านบน</div>
            <button id="actionBtn" disabled class="w-full py-3.5 rounded-xl font-bold text-white bg-slate-300 transition-all shadow-md flex items-center justify-center space-x-2 cursor-not-allowed">
                <i class="fa-solid fa-camera text-lg"></i>
                <span id="btnText">โปรดเลือกจุดถังขยะ</span>
            </button>
            <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden">
        </div>

        <!-- ประวัติการแจ้งเตือนวันนี้ -->
        <div class="mt-6">
            <h2 class="text-md font-bold mb-3 flex items-center justify-between text-slate-700">
                <span><i class="fa-solid fa-clock-rotate-left mr-2 text-emerald-600"></i>ประวัติการแจ้งเตือนวันนี้</span>
                <span id="historyCount" class="text-xs bg-emerald-100 text-emerald-700 px-2.5 py-1 rounded-full font-semibold">0 รายการ</span>
            </h2>
            <div id="historyList" class="space-y-2.5">
                <!-- ประวัติจะถูกโหลดมาแสดงที่นี่ -->
            </div>
        </div>
    </main>

    <!-- Modal แสดงรูปภาพขยาย -->
    <div id="imageModal" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-4" onclick="closeImageModal()">
        <div class="relative max-w-lg w-full bg-white rounded-2xl overflow-hidden shadow-2xl" onclick="event.stopPropagation()">
            <img id="modalImg" src="" class="w-full h-auto max-h-[70vh] object-contain bg-black">
            <div class="p-4 flex justify-between items-center bg-white">
                <span id="modalCaption" class="text-sm font-medium text-slate-700"></span>
                <button onclick="closeImageModal()" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-800 rounded-xl text-sm font-bold transition-all">ปิด</button>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Firebase SDK (Modular v9) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, getDocs, onSnapshot, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Firebase Configuration ของคุณ
        const firebaseConfig = {
            apiKey: "AIzaSyA9PTYshb0p-epm6CaWQkdwIhV0gePdNlE",
            authDomain: "binalert-app-ee134.firebaseapp.com",
            projectId: "binalert-app-ee134",
            storageBucket: "binalert-app-ee134.firebasestorage.app",
            messagingSenderId: "868487761387",
            appId: "1:868487761387:web:d79ec3de3ee18d50979dae",
            measurementId: "G-GZQMLGX100"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // ข้อมูลจุดถังขยะในโรงเรียน
        const bins = [
            { id: 1, name: "ถังขยะ หน้าตึกอำนวยการ", lat: 13.7563, lng: 100.5018 },
            { id: 2, name: "ถังขยะ โรงอาหาร", lat: 13.7558, lng: 100.5025 },
            { id: 3, name: "ถังขยะ หน้าอาคารเรียน 1", lat: 13.7570, lng: 100.5010 },
            { id: 4, name: "ถังขยะ โรงยิมเนเซียม", lat: 13.7550, lng: 100.5030 }
        ];

        let currentMode = 'student';
        let selectedBin = null;
        let map, markers = {};
        let binStatuses = {}; // เก็บสถานะถังขยะแบบ Real-time

        // เริ่มต้นการทำงานแผนที่
        function initMap() {
            map = L.map('map').setView([13.7560, 100.5020], 17);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© OpenStreetMap'
            }).addTo(map);

            bins.forEach(bin => {
                const marker = L.circleMarker([bin.lat, bin.lng], {
                    radius: 12,
                    fillColor: "#22c55e",
                    color: "#ffffff",
                    weight: 3,
                    opacity: 1,
                    fillOpacity: 0.9
                }).addTo(map);

                marker.on('click', () => selectBin(bin));
                markers[bin.id] = marker;
            });

            // ดึงข้อมูลสถานะและประวัติจาก Firestore แบบ Real-time
            listenToFirestore();
        }

        function selectBin(bin) {
            selectedBin = bin;
            Object.values(markers).forEach(m => m.setStyle({ color: '#ffffff', weight: 3 }));
            markers[bin.id].setStyle({ color: '#fbbf24', weight: 5 });

            const statusInfo = document.getElementById('statusInfo');
            const actionBtn = document.getElementById('actionBtn');
            const btnText = document.getElementById('btnText');

            statusInfo.innerHTML = `จุดที่เลือก: <strong class="text-emerald-700">${bin.name}</strong>`;
            actionBtn.disabled = false;
            actionBtn.classList.remove('bg-slate-300', 'cursor-not-allowed');

            if (currentMode === 'student') {
                actionBtn.className = "w-full py-3.5 rounded-xl font-bold text-white bg-emerald-600 hover:bg-emerald-700 transition-all shadow-md flex items-center justify-center space-x-2";
                btnText.innerText = "ถ่ายรูปแจ้งถังขยะเต็ม";
                actionBtn.onclick = () => document.getElementById('cameraInput').click();
            } else {
                const status = binStatuses[bin.id] || 'normal';
                if (status === 'full') {
                    actionBtn.className = "w-full py-3.5 rounded-xl font-bold text-white bg-amber-500 hover:bg-amber-600 transition-all shadow-md flex items-center justify-center space-x-2";
                    btnText.innerText = "กดเพื่อยืนยันเคลียร์ขยะแล้ว";
                    actionBtn.onclick = () => clearBin(bin.id);
                } else {
                    actionBtn.className = "w-full py-3.5 rounded-xl font-bold text-white bg-slate-400 cursor-not-allowed";
                    btnText.innerText = "ถังขยะปกติดี (ไม่ต้องทำความสะอาด)";
                    actionBtn.onclick = null;
                }
            }
        }

        window.switchMode = function(mode) {
            currentMode = mode;
            selectedBin = null;
            document.getElementById('statusInfo').innerText = "กรุณาเลือกจุดถังขยะบนแผนที่ด้านบน";
            const btn = document.getElementById('actionBtn');
            btn.disabled = true;
            btn.className = "w-full py-3.5 rounded-xl font-bold text-white bg-slate-300 transition-all shadow-md flex items-center justify-center space-x-2 cursor-not-allowed";
            document.getElementById('btnText').innerText = "โปรดเลือกจุดถังขยะ";

            Object.values(markers).forEach(m => m.setStyle({ color: '#ffffff', weight: 3 }));

            if (mode === 'student') {
                document.getElementById('btnStudent').className = "px-3 py-1.5 rounded-lg text-sm font-medium transition-all bg-white text-emerald-700 shadow";
                document.getElementById('btnCleaner').className = "px-3 py-1.5 rounded-lg text-sm font-medium transition-all text-white";
            } else {
                document.getElementById('btnCleaner').className = "px-3 py-1.5 rounded-lg text-sm font-medium transition-all bg-white text-emerald-700 shadow";
                document.getElementById('btnStudent').className = "px-3 py-1.5 rounded-lg text-sm font-medium transition-all text-white";
            }
        }

        // จัดการถ่ายภาพและบีบอัดภาพก่อนส่งขึ้น Firebase
        const cameraInput = document.getElementById('cameraInput');
        cameraInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file || !selectedBin) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 600;
                    const MAX_HEIGHT = 600;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    } else {
                        if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.7);

                    saveAlertToFirebase(selectedBin, compressedDataUrl);
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
            cameraInput.value = ''; // เคลียร์ค่าเพื่อให้กดถ่ายซ้ำได้ทันที
        });

        // บันทึกข้อมูลลง Firestore
        async function saveAlertToFirebase(bin, imgData) {
            const timeStr = new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
            const dateStr = new Date().toISOString().split('T')[0];
            const alertId = "alert_" + Date.now();

            try {
                // บันทึกประวัติ
                await setDoc(doc(db, "binalert_history", alertId), {
                    id: alertId,
                    binId: bin.id,
                    binName: bin.name,
                    time: timeStr,
                    date: dateStr,
                    image: imgData
                });

                // อัปเดตสถานะถังขยะเป็น "เต็ม"
                await setDoc(doc(db, "binalert_statuses", String(bin.id)), {
                    status: 'full'
                });

                alert("แจ้งเตือนถังขยะเต็มสำเร็จ!");
                selectBin(bin);
            } catch (error) {
                console.error("Error saving alert: ", error);
                alert("เกิดข้อผิดพลาดในการเชื่อมต่อฐานข้อมูล");
            }
        }

        // แม่บ้านกดเคลียร์ถังขยะ
        async function clearBin(binId) {
            try {
                await setDoc(doc(db, "binalert_statuses", String(binId)), {
                    status: 'normal'
                });
                alert("เคลียร์ถังขยะเรียบร้อยแล้ว สถานะกลับเป็นปกติ");
                selectBin(bins.find(b => b.id === binId));
            } catch (error) {
                console.error("Error clearing bin: ", error);
            }
        }

        // ดึงข้อมูลและฟังการเปลี่ยนแปลงแบบ Real-time จาก Firebase
        function listenToFirestore() {
            // ฟังสถานะถังขยะ
            onSnapshot(collection(db, "binalert_statuses"), (snapshot) => {
                binStatuses = {};
                snapshot.forEach((doc) => {
                    binStatuses[doc.id] = doc.data().status;
                });

                // อัปเดตสีหมุดบนแผนที่
                bins.forEach(bin => {
                    const status = binStatuses[bin.id] || 'normal';
                    if (markers[bin.id]) {
                        markers[bin.id].setStyle({
                            fillColor: status === 'full' ? '#ef4444' : '#22c55e'
                        });
                    }
                });

                if (selectedBin) selectBin(selectedBin);
            });

            // ฟังประวัติการแจ้งเตือนของวันนี้
            onSnapshot(collection(db, "binalert_history"), (snapshot) => {
                const historyList = document.getElementById('historyList');
                historyList.innerHTML = '';
                
                const todayStr = new Date().toISOString().split('T')[0];
                let histories = [];
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    if (data.date === todayStr) {
                        histories.push(data);
                    }
                });

                // เรียงจากล่าสุดไปเก่าสุด
                histories.sort((a, b) => b.id.localeCompare(a.id));
                document.getElementById('historyCount').innerText = `${histories.length} รายการ`;

                if (histories.length === 0) {
                    historyList.innerHTML = `<div class="text-center py-6 text-slate-400 text-sm bg-white rounded-2xl border border-slate-100">ยังไม่มีประวัติการแจ้งเตือนในวันนี้</div>`;
                    return;
                }

                histories.forEach(item => {
                    const div = document.createElement('div');
                    div.className = "flex items-center justify-between bg-white p-3 rounded-2xl shadow-sm border border-slate-100";
                    div.innerHTML = `
                        <div class="flex items-center space-x-3">
                            <img src="${item.image}" class="w-12 h-12 object-cover rounded-xl cursor-pointer border border-slate-200" onclick="openImageModal('${item.image}', '${item.binName} (${item.time})')">
                            <div>
                                <h3 class="text-sm font-bold text-slate-700">${item.binName}</h3>
                                <p class="text-xs text-rose-500 font-semibold"><i class="fa-solid fa-triangle-exclamation mr-1"></i>ถังขยะเต็ม • ${item.time}</p>
                            </div>
                        </div>
                        <span class="text-xs bg-rose-50 text-rose-600 px-2.5 py-1 rounded-full font-bold">รอเคลียร์</span>
                    `;
                    historyList.appendChild(div);
                });
            });
        }

        window.openImageModal = function(src, caption) {
            document.getElementById('modalImg').src = src;
            document.getElementById('modalCaption').innerText = caption;
            document.getElementById('imageModal').classList.remove('hidden');
        }

        window.closeImageModal = function() {
            document.getElementById('imageModal').classList.add('hidden');
        }

        window.onload = initMap;
    </script>
</body>
</html>
